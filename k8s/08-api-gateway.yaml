apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: sports-center
  labels: { app: api-gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
      # ---- main application container (writes access log to the shared volume) ----
      - name: app
        image: sports/api-gateway:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef: { name: sports-secrets, key: JWT_SECRET }
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef: { name: sports-secrets, key: INTERNAL_API_KEY }
        - name: CORS_ORIGIN
          valueFrom:
            configMapKeyRef: { name: sports-config, key: CORS_ORIGIN }
        - name: REGISTRATION_URL
          valueFrom:
            configMapKeyRef: { name: sports-config, key: REGISTRATION_URL }
        - name: AUTH_URL
          valueFrom:
            configMapKeyRef: { name: sports-config, key: AUTH_URL }
        - name: FACILITY_URL
          valueFrom:
            configMapKeyRef: { name: sports-config, key: FACILITY_URL }
        - name: RESERVATION_URL
          valueFrom:
            configMapKeyRef: { name: sports-config, key: RESERVATION_URL }
        - name: MATCHING_URL
          valueFrom:
            configMapKeyRef: { name: sports-config, key: MATCHING_URL }
        - name: MAINTENANCE_URL
          valueFrom:
            configMapKeyRef: { name: sports-config, key: MAINTENANCE_URL }
        - name: LOG_DIR
          valueFrom:
            configMapKeyRef: { name: sports-config, key: LOG_DIR }
        volumeMounts:
        - name: app-logs
          mountPath: /var/log/app
        readinessProbe:
          httpGet: { path: /health, port: 3000 }
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet: { path: /health, port: 3000 }
          initialDelaySeconds: 40
          periodSeconds: 20
          failureThreshold: 5
        resources:
          requests: { cpu: 50m, memory: 96Mi }
          limits: { cpu: 300m, memory: 256Mi }
      # ---- second container reading the SAME volume (demonstrates shared storage) ----
      - name: log-reader
        image: busybox:1.36
        command: ["sh", "-c", "touch /logs/api-gateway.log; tail -n+1 -F /logs/api-gateway.log"]
        volumeMounts:
        - name: app-logs
          mountPath: /logs
          readOnly: true
        resources:
          requests: { cpu: 5m, memory: 8Mi }
          limits: { cpu: 50m, memory: 32Mi }
      volumes:
      - name: app-logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: sports-center
spec:
  type: ClusterIP
  selector: { app: api-gateway }
  ports:
  - port: 3000
    targetPort: 3000
