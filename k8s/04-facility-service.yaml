apiVersion: apps/v1
kind: Deployment
metadata:
  name: facility-service
  namespace: sports-center
  labels: { app: facility-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: facility-service }
  template:
    metadata:
      labels: { app: facility-service }
    spec:
      containers:
      # ---- main application container (writes access log to the shared volume) ----
      - name: app
        image: sports/facility-service:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3003
        env:
        - name: MONGO_USER
          valueFrom:
            secretKeyRef: { name: sports-secrets, key: MONGO_USER }
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef: { name: sports-secrets, key: MONGO_PASSWORD }
        - name: MONGO_HOST
          valueFrom:
            secretKeyRef: { name: sports-secrets, key: MONGO_HOST }
        - name: MONGO_URI
          value: "mongodb+srv://$(MONGO_USER):$(MONGO_PASSWORD)@$(MONGO_HOST)/facility_db?retryWrites=true&w=majority"
        - name: PORT
          value: "3003"
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef: { name: sports-secrets, key: INTERNAL_API_KEY }
        - name: LOG_DIR
          valueFrom:
            configMapKeyRef: { name: sports-config, key: LOG_DIR }
        volumeMounts:
        - name: app-logs
          mountPath: /var/log/app
        readinessProbe:
          httpGet: { path: /health, port: 3003 }
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet: { path: /health, port: 3003 }
          initialDelaySeconds: 40
          periodSeconds: 20
          failureThreshold: 5
        resources:
          requests: { cpu: 50m, memory: 96Mi }
          limits: { cpu: 300m, memory: 256Mi }
      # ---- second container reading the SAME volume (demonstrates shared storage) ----
      - name: log-reader
        image: busybox:1.36
        command: ["sh", "-c", "touch /logs/facility-service.log; tail -n+1 -F /logs/facility-service.log"]
        volumeMounts:
        - name: app-logs
          mountPath: /logs
          readOnly: true
        resources:
          requests: { cpu: 5m, memory: 8Mi }
          limits: { cpu: 50m, memory: 32Mi }
      volumes:
      - name: app-logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: facility-service
  namespace: sports-center
spec:
  type: ClusterIP
  selector: { app: facility-service }
  ports:
  - port: 3003
    targetPort: 3003
