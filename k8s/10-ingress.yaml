# Fanout Ingress: ONE host name, MANY paths. Every path is forwarded to the API Gateway
# (project rule 3: clients must never reach a microservice directly).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sports-ingress
  namespace: sports-center
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
  - host: aupp.com
    http:
      paths:
      - path: /api/auth
        pathType: Prefix
        backend:
          service: { name: api-gateway, port: { number: 3000 } }
      - path: /api/facilities
        pathType: Prefix
        backend:
          service: { name: api-gateway, port: { number: 3000 } }
      - path: /api/reservations
        pathType: Prefix
        backend:
          service: { name: api-gateway, port: { number: 3000 } }
      - path: /api/matching
        pathType: Prefix
        backend:
          service: { name: api-gateway, port: { number: 3000 } }
      - path: /api/maintenance
        pathType: Prefix
        backend:
          service: { name: api-gateway, port: { number: 3000 } }
      - path: /health
        pathType: Prefix
        backend:
          service: { name: api-gateway, port: { number: 3000 } }
